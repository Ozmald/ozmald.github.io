<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню Напитков</title>
    <style>
        body {
            margin: 0;
            padding: 3vh 4vw;
            height: 100vh;
            overflow: hidden; 
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background-image: url('image_3.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.25);
            z-index: -1;
        }

        .menu-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            column-count: 2;
            column-gap: 6vw; 
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2vh 0 0.8vh 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            break-inside: avoid;
            margin-bottom: 0;
        }

        .item-info { 
            flex-grow: 1; 
            padding-right: 20px; 
            padding-left: 32px; 
            position: relative;
        }

        .item-header { 
            display: flex; 
            align-items: baseline; 
            margin-bottom: 0.2vh; 
        }

        .item-num { 
            position: absolute;
            left: 0;
            top: 0;
            font-weight: bold; 
            font-size: 2.2vh; 
            color: #ffffff;
        }
        
        .item-title { 
            font-weight: bold; 
            font-size: 2.8vh; 
            letter-spacing: 0.5px; 
            color: #ffffff;
        }
        
        .item-subtitle { 
            font-size: 1.7vh; 
            color: rgba(255, 255, 255, 0.75); 
            letter-spacing: 0.3px; 
        }
        
        /* Центрированные фиксированные контейнеры цен */
        .item-price { 
            font-weight: bold; 
            font-size: 3.2vh; 
            white-space: nowrap; 
            color: #ffffff;
            text-align: center;
            width: 180px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* Панель кнопок */
        .controls {
            position: fixed;
            top: 2vh;
            right: 2vw;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .toggle-btn {
            width: 46px;
            height: 46px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }
        .toggle-btn:hover { 
            background: rgba(255, 255, 255, 0.2); 
            transform: scale(1.05);
        }

        body.fake-fullscreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 99999;
            padding: 4vh 5vw;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="toggle-btn" onclick="toggleFullScreen()" title="На весь экран">⛶</button>
    </div>

    <div class="menu-container" id="menu-list">
        <div style="color: white; font-size: 2.5vh; text-align: center;">Загрузка меню...</div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzF7IkfZTrjTQMmgbyN9LFMEIJGd8SV8a1Yl_-T-OwzQzYhgpDnR5MCvYiLVsFET7Ry/exec';

        document.addEventListener('DOMContentLoaded', loadMenuFromCloud);

        function loadMenuFromCloud() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);
            xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var container = document.getElementById('menu-list');
                        container.innerHTML = '';
                        
                        for (var index = 0; index < data.items.length; index++) {
                            var item = data.items[index];
                            var itemNumber = index + 1;
                            
                            var div = document.createElement('div');
                            div.className = 'menu-item';
                            div.innerHTML =
                                '<div class="item-info">' +
                                    '<span class="item-num">' + itemNumber + '.</span>' +
                                    '<div class="item-header">' +
                                        '<span class="item-title">' + (item.title || '') + '</span>' +
                                    '</div>' +
                                    '<div class="item-subtitle">' + (item.subtitle || '') + '</div>' +
                                '</div>' +
                                '<div class="item-price">' + (item.price || '') + '</div>';
                            container.appendChild(div);
                        }
                    } catch (e) {
                        console.error("Ошибка парсинга:", e);
                    }
                }
            };
            xhr.send();
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(function (err) {
                        document.body.classList.toggle('fake-fullscreen');
                    });
                } else {
                    document.body.classList.toggle('fake-fullscreen');
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                document.body.classList.remove('fake-fullscreen');
            }
        }
    </script>
</body>
</html>
